services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/rca_agent.db
      RCA_SANDBOX_IMAGE: agentic-rca-sandbox:py311
      RCA_SANDBOX_VOLUME: agentic-rca-sandbox-workspaces
      RCA_SANDBOX_WORKDIR: /sandbox-workspaces
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - rca-data:/data
      - ./workspaces:/app/workspaces
      - sandbox-workspaces:/sandbox-workspaces
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

  sandbox:
    build:
      context: .
      dockerfile: backend/services/sandbox.Dockerfile
    image: agentic-rca-sandbox:py311
    profiles:
      - tools

volumes:
  rca-data:
  sandbox-workspaces:
    name: agentic-rca-sandbox-workspaces
